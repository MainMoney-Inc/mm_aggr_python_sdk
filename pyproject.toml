[project]
name = "mm-aggr"
version = "0.1.0"
description = "Python SDK for the MainMoney aggregator merchant API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "SEE LICENSE IN LICENSE" }
authors = [{ name = "MainMoney SARL" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mm_aggr"]

[tool.poetry]
name = "mm-aggr"
version = "0.1.0"
description = "Python SDK for the MainMoney aggregator merchant API"
authors = ["MainMoney SARL"]
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
readme = "README.md"
packages = [{ include = "mm_aggr", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
mypy = ">=1.11.0"
ruff = ">=0.6.0"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
]
