[project]
name = "mm-aggr-sdk"
dynamic = ["version"]
description = "Python SDK for the MainMoney aggregator merchant API"
readme = "README.md"
version = "0.1.2"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "MainMoney SARL" }]
keywords = ["mainmoney", "payments", "merchant", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.32.0",
]

[project.urls]
Homepage = "https://github.com/MainMoney-Inc/mm_aggr_python_sdk"
Issues = "https://github.com/MainMoney-Inc/mm_aggr_python_sdk/issues"
Changelog = "https://github.com/MainMoney-Inc/mm_aggr_python_sdk/blob/main/CHANGELOG.md"
Source = "https://github.com/MainMoney-Inc/mm_aggr_python_sdk"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "types-requests>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/mm_aggr/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mm_aggr"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "types-requests>=2.32.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["dist", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["mm_aggr"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mm_aggr"]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
