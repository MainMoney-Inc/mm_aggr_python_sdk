[project]
name = "mm-aggr"
version = "0.1.0"
description = "Python SDK for the MainMoney aggregator merchant API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "SEE LICENSE IN LICENSE" }
authors = [{ name = "MainMoney SARL" }]
keywords = ["mainmoney", "payments", "merchant", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.32.0",
]

[project.urls]
Homepage = "https://github.com/MainMoney-Inc/mm_aggr_python_sdk"
Issues = "https://github.com/MainMoney-Inc/mm_aggr_python_sdk/issues"
Source = "https://github.com/MainMoney-Inc/mm_aggr_python_sdk"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "types-requests>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mm_aggr"]

[tool.poetry]
name = "mm-aggr"
version = "0.1.0"
description = "Python SDK for the MainMoney aggregator merchant API"
authors = ["MainMoney SARL"]
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
readme = "README.md"
homepage = "https://github.com/MainMoney-Inc/mm_aggr_python_sdk"
repository = "https://github.com/MainMoney-Inc/mm_aggr_python_sdk"
keywords = ["mainmoney", "payments", "merchant", "sdk"]
packages = [{ include = "mm_aggr", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
requests = ">=2.32.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
mypy = ">=1.11.0"
ruff = ">=0.6.0"
types-requests = ">=2.32.0"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "types-requests>=2.32.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["mm_aggr"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mm_aggr"]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
